<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Test: Full Checklist with Generator</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/checklist-variables.css" />
  <link rel="stylesheet" href="css/checklist-style.css" />
  
  <style>
    .test-header {
      background: #f0f0f0;
      padding: 20px;
      margin-bottom: 20px;
      border-bottom: 3px solid #007bff;
    }
    .test-header h1 {
      margin: 0 0 10px 0;
    }
    .test-info {
      font-size: 14px;
      color: #666;
    }
    .test-controls {
      background: #e8f4f8;
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .test-controls button {
      padding: 8px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
    }
    .test-controls button:hover {
      background: #0056b3;
    }
    .progress-display {
      background: #d4edda;
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
      font-weight: bold;
      color: #155724;
    }
  </style>
</head>

<body>
  <div class="checklist-wrapper">
    <div class="test-header">
      <h1>🧹 Full Checklist Generator Test</h1>
      <div class="test-info">
        <p><strong>Test Purpose:</strong> Verify data-driven component generation produces identical output to hardcoded HTML</p>
        <p><strong>Strategy:</strong> All rooms are generated from CHECKLIST_CONFIG using ChecklistPageGenerator</p>
      </div>
    </div>

    <div class="test-controls">
      <button onclick="updateProgress()">📊 Update Progress</button>
      <button onclick="resetAll()">🔄 Reset All</button>
      <button onclick="checkConsole()">🔍 Check Console</button>
    </div>

    <div id="progress-display" class="progress-display">Loading...</div>

    <div id="rooms-container" style="margin-top: 20px;"></div>
  </div>

  <!-- Import Components & Config -->
  <script src="js/components/AysDisclosureRoomCard.js"></script>
  <script src="js/components/AysChecklistItemCheckbox.js"></script>
  <script src="js/data/checklist-config.js"></script>
  <script src="js/generators/AysChecklistFormFactory.js"></script>

  <script>
    // Initialize generator
    const generator = new AysChecklistFormFactory('rooms-container');

    // Generate all rooms from config
    console.log('=== GENERATING CHECKLIST FROM CONFIG ===');
    generator.generate(CHECKLIST_CONFIG);
    console.log('✓ Generation complete');

    // Display initial progress
    updateProgress();

    // Control Functions
    function updateProgress() {
      const progress = generator.getProgress();
      const display = document.getElementById('progress-display');
      display.innerHTML = `
        <span>✅ ${progress.checked} / ${progress.total} items complete (${progress.percentage}%)</span>
      `;
      console.log(`Progress: ${progress.checked}/${progress.total} (${progress.percentage}%)`);
    }

    function resetAll() {
      if (confirm('Reset all items to unchecked?')) {
        generator.resetAll();
        updateProgress();
      }
    }

    function checkConsole() {
      console.log('=== DEBUG INFO ===');
      console.log('Cards created:', generator.cards.length);
      console.log('Generator object:', generator);
      alert('Check browser console (F12) for detailed debug info');
    }

    // Update progress when any checkbox changes
    document.addEventListener('change', (e) => {
      if (e.target.matches('input[type="checkbox"]')) {
        updateProgress();
      }
    }, true);
  </script>
</body>

</html>
