<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test: Generator vs Original Comparison</title>
  <link rel="stylesheet" href="css/checklist-variables.css" />
  <link rel="stylesheet" href="css/checklist-style.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
    .panel { border: 2px solid #ccc; padding: 15px; border-radius: 5px; }
    .panel h2 { margin-top: 0; color: #333; }
    .panel.original { border-color: #0066cc; background: #f0f7ff; }
    .panel.generated { border-color: #00aa00; background: #f0fff0; }
    .checklist-wrapper { max-height: 600px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; }
    .validation-report { background: #fffacd; padding: 15px; margin: 20px 0; border-left: 4px solid #ffaa00; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    button { padding: 8px 15px; margin: 5px; background: #0066cc; color: white; border: none; cursor: pointer; }
    button:hover { background: #0052a3; }
  </style>
</head>
<body>
  <h1>🔍 Generator vs Original Comparison</h1>
  
  <div class="validation-report">
    <h3>Validation Checklist</h3>
    <div id="validation-results"></div>
    <button onclick="runValidation()">Run Validation</button>
    <button onclick="compareDOM()">Compare DOM Structure</button>
  </div>

  <div class="comparison-grid">
    <div class="panel original">
      <h2>Original HTML (First 2 Rooms)</h2>
      <div id="original-content" class="checklist-wrapper"></div>
    </div>
    
    <div class="panel generated">
      <h2>Generated (First 2 Rooms)</h2>
      <div id="generated-content" class="checklist-wrapper"></div>
    </div>
  </div>

  <!-- Original page iframe (hidden) -->
  <iframe id="original-iframe" src="checklist-modern.html" style="display:none;"></iframe>

  <!-- Import Components -->
  <script src="js/components/AysDisclosureRoomCard.js"></script>
  <script src="js/components/AysChecklistItemCheckbox.js"></script>
  <script src="js/data/checklist-config.js"></script>
  <script src="js/generators/AysChecklistFormFactory.js"></script>

  <script>
    // Test data: First 2 rooms only
    const testConfig = {
      rooms: CHECKLIST_CONFIG.rooms.slice(0, 2)  // Kitchen + Living Room
    };

    // Generate cards
    const generator = new ChecklistPageGenerator('generated-content');
    generator.generate(testConfig);

    console.log('✓ Generator test page loaded');
    console.log('✓ Created', generator.getCards().length, 'cards');

    // Validation function
    function runValidation() {
      const results = [];
      const generatedContainer = document.getElementById('generated-content');
      
      // Check 1: All cards rendered
      const cards = generatedContainer.querySelectorAll('details');
      results.push({
        check: `Cards rendered: ${cards.length}/2`,
        pass: cards.length === 2
      });

      // Check 2: All items rendered
      const items = generatedContainer.querySelectorAll('input[type="checkbox"]');
      results.push({
        check: `Checkbox items: ${items.length}/17`,
        pass: items.length === 17  // 10 kitchen + 7 living
      });

      // Check 3: Progress badges
      const badges = generatedContainer.querySelectorAll('.progress-badge');
      results.push({
        check: `Progress badges: ${badges.length}/2`,
        pass: badges.length === 2
      });

      // Check 4: No console errors
      results.push({
        check: 'No console errors',
        pass: true  // Check manually
      });

      // Check 5: Interaction works
      results.push({
        check: 'Click a checkbox to verify progress updates',
        pass: true  // Manual test
      });

      // Display results
      const html = results.map(r => 
        `<div><span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? '✓' : '✗'}</span> ${r.check}</div>`
      ).join('');
      document.getElementById('validation-results').innerHTML = html;

      console.table(results);
    }

    function compareDOM() {
      const generated = document.getElementById('generated-content');
      const origDetails = generated.querySelectorAll('details');
      
      console.log('=== Generated DOM Structure ===');
      origDetails.forEach((details, idx) => {
        const room = details.getAttribute('data-room');
        const summary = details.querySelector('summary');
        const title = summary.querySelector('.room-title').textContent;
        const items = details.querySelectorAll('input[type="checkbox"]');
        
        console.log(`[${idx}] ${title} (${room}): ${items.length} items`);
      });
    }

    // Auto-run validation on load
    window.addEventListener('load', () => {
      setTimeout(runValidation, 500);
    });
  </script>
</body>
</html>
