<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Test: Kitchen Component</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/checklist-variables.css" />
  <link rel="stylesheet" href="css/checklist-style.css" />
</head>

<body>
  <div class="checklist-wrapper">
    <h1>Testing: Kitchen Section (AysDisclosureCard)</h1>
    <div id="rooms-container"></div>
  </div>

  <!-- Import Components -->
  <script src="js/components/AysDisclosureRoomCard.js"></script>
  <script src="js/components/AysChecklistItemCheckbox.js"></script>

  <script>
    // Kitchen Room Data
    const kitchenData = {
      roomId: 'kitchen',
      emoji: '🍳',
      title: 'Kitchen',
      items: [
        { itemId: 'kitchen-sinks', label: 'Sinks and Faucets', category: 'basic', hours: 0.5 },
        { itemId: 'kitchen-microwave-out', label: 'Microwave (outside)', category: 'basic', hours: 0.5 },
        { itemId: 'kitchen-countertops', label: 'Countertops', category: 'basic', hours: 0.5 },
        { itemId: 'kitchen-floors', label: 'Floors Mopped', category: 'basic', hours: 0.5 },
        { itemId: 'kitchen-baseboards', label: 'Baseboards wiped', category: 'basic', hours: 0.5 },
        { itemId: 'kitchen-garbage', label: 'Garbage bags removed', category: 'basic', hours: 0.5 },
        { itemId: 'kitchen-stovetop', label: 'Stovetop wiped', category: 'basic', hours: 0.5 },
        { itemId: 'kitchen-fridge-out', label: 'Refrig. (outside)', category: 'basic', hours: 0.5 },
        { itemId: 'kitchen-drawers', label: 'Drawers/Pantry (empty & wipe) - $50', category: 'drawer', hours: 1, baseCharge: 50, serviceCode: 'KDRAW', settingsKey: 'surcharge_drawers', difficulty: 'basic' },
        { itemId: 'kitchen-lights', label: 'Light switches', category: 'basic', hours: 0.5 }
      ]
    };

    // Create Disclosure Card
    const card = new AysDisclosureRoomCard({
      roomId: kitchenData.roomId,
      title: kitchenData.emoji + ' ' + kitchenData.title,
      items: kitchenData.items
    });

    // Render
    const container = document.getElementById('rooms-container');
    container.appendChild(card.render());
    card.bind();

    // Log for debugging
    console.log('Kitchen card created:', card);
  </script>
</body>

</html>
